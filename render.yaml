# Render Blueprint for the Varinth backend.
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Render reads this file automatically and pre-fills the service; you only
# need to fill in the "sync: false" values (secrets Render refuses to guess)
# in its dashboard before the first deploy.
#
# The Dockerfile listens on $PORT (Render sets this itself) — see
# backend/Dockerfile's CMD. Free tier: cold starts after ~15 min idle; this
# is a known, accepted tradeoff for now, not an oversight.

services:
  - type: web
    name: varinth-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_EMBED_MODEL
        value: nvidia/nemotron-3.5-embed-1b
      - key: NVIDIA_CHAT_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      # Set this to your Vercel frontend's actual URL after that's deployed
      # (e.g. https://varinth.vercel.app) — comma-separate if you add a
      # custom domain later. No trailing slash.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
